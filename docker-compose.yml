name: portfolio-web

services:
  server:
    build:
      context: .
      target: local
      args:
        PORTFOLIO_CONFIG_CLI_TAG: ${PORTFOLIO_CONFIG_CLI_TAG:?Use pnpm local:up}
      secrets:
        - npm-token
        - github-token
    environment:
      - GH_TOKEN
      - WATCHPACK_POLLING=true
    ports:
      - "127.0.0.1:${WEB_LOCAL_PORT:-3001}:3000"
      - "[::1]:${WEB_LOCAL_PORT:-3001}:3000"
    volumes:
      - ./src:/app/src:delegated
      - ./public:/app/public:delegated
      - ./docs:/app/docs:delegated
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 6

secrets:
  github-token:
    environment: GH_TOKEN
  npm-token:
    environment: GITHUB_NPM_TOKEN
