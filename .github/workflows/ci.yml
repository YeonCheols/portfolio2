name: CI

on:
  pull_request:
    branches:
      - master
      - dev

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        env:
          # Actions secret 이름은 GITHUB_ 로 시작할 수 없다.
          # .npmrc 는 환경 변수 GITHUB_NPM_TOKEN 을 읽는다.
          GITHUB_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: MCP 의존성 설치 및 빌드
        run: |
          pnpm --dir mcp install --frozen-lockfile
          pnpm --dir mcp build

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm type-check

      - name: 단위 테스트 + 커버리지
        shell: bash
        run: |
          pnpm exec jest --ci --coverage --passWithNoTests --coverageReporters=text --coverageReporters=lcov | tee coverage-report.txt
          {
            echo "## 테스트 커버리지"
            echo '```'
            grep -E "^(File |All files)" coverage-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
