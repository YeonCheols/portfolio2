name: AI 리뷰

on:
  # PR 생성·푸시 자동 실행은 꺼 둔다. 댓글 /review 로만 실행한다.
  # issue_comment 워크플로는 기본 브랜치의 이 파일 기준으로 동작한다.
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

# 에이전트 단계에는 GitHub 토큰을 넘기지 않는다. PR 조회와 댓글 작성 단계에서만 사용
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI 리뷰
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == '/review' ||
       startsWith(github.event.comment.body, '/review ')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::warning::CURSOR_API_KEY secret이 없어 AI 리뷰를 건너뜁니다"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r base head_sha head_repo state < <(gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq '[.base.ref, .head.sha, .head.repo.full_name, .state] | @tsv')
          # 포크 PR(신뢰할 수 없는 입력)과 닫힌 PR은 리뷰하지 않는다
          if [ "$head_repo" != "$REPO" ] || [ "$state" != "open" ]; then
            echo "::notice::리뷰 대상이 아닌 PR입니다 (head: ${head_repo}, state: ${state})"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "BASE_REF=${base}"
            echo "HEAD_SHA=${head_sha}"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.enabled == 'true'
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: PR diff 생성
        if: steps.pr.outputs.enabled == 'true'
        run: |
          git diff "origin/${BASE_REF}...HEAD" -- . \
            ':(exclude)pnpm-lock.yaml' ':(exclude).next/**' ':(exclude)coverage/**' \
            > /tmp/pr.diff
          size=$(wc -c < /tmp/pr.diff)
          echo "diff bytes: $size"
          # 너무 큰 diff는 앞부분만 리뷰하고 그 사실을 프롬프트에 알린다
          if [ "$size" -gt 200000 ]; then
            head -c 200000 /tmp/pr.diff > /tmp/pr.diff.cut && mv /tmp/pr.diff.cut /tmp/pr.diff
            echo "TRUNCATED=true" >> "$GITHUB_ENV"
          fi

      - name: Install Cursor CLI
        if: steps.pr.outputs.enabled == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run review
        if: steps.pr.outputs.enabled == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # 비우면 목록에 composer-2.5가 있을 때만 사용한다. 없으면 리뷰를 건너뛴다
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: |
          # shellcheck source=../../.agents/skills/review/scripts/review-ci.sh
          source .agents/skills/review/scripts/review-ci.sh
          model="$(select_review_model "${AI_REVIEW_MODEL:-}" "$(agent models 2>/dev/null || true)")"
          if [ -z "$model" ]; then
            echo "::warning::목록에서 모델을 확정하지 못해 리뷰를 건너뜁니다 (계정 기본 모델로 실행하지 않음)"
            : > /tmp/review.md
            exit 0
          fi
          echo "model: $model"
          note=""
          [ "${TRUNCATED:-}" = "true" ] && note="diff가 200KB를 넘어 앞부분만 제공되었다. 이 사실을 '확인한 범위'에 적어라."
          prompt="이 저장소의 AGENTS.md, .agents/skills/review/SKILL.md, .agents/skills/review/TEMPLATE.md를 읽고, review 스킬의 ci 모드로 PR #${PR_NUMBER}(base: ${BASE_REF})를 리뷰하라.
          리뷰 대상 diff는 /tmp/pr.diff 파일이다. 맥락 확인을 위해 저장소 파일을 읽어도 되지만 어떤 파일도 수정하거나 명령을 실행하지 마라.
          이번 실행 모델은 ${model} 이다. TEMPLATE.md의 '확인한 범위'에 적어라.
          ${note}
          출력은 TEMPLATE.md를 채운 마크다운만, 한국어로 작성하라. 템플릿에 없는 문장이나 섹션은 쓰지 마라. 테스트 근거가 없는 발견은 빼라."
          if agent -p --mode ask --trust --model "$model" --output-format text "$prompt" > /tmp/review.md 2> /tmp/agent.err && [ -s /tmp/review.md ]; then
            echo "review bytes: $(wc -c < /tmp/review.md)"
          else
            echo "::warning::AI 리뷰 실행 실패 (체크는 실패시키지 않음)"
            tail -20 /tmp/agent.err || true
            : > /tmp/review.md
          fi

      - name: Post review comment
        if: steps.pr.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -s /tmp/review.md ]; then
            echo "리뷰 결과가 없어 댓글을 남기지 않습니다"
            exit 0
          fi
          # 본문은 TEMPLATE.md만. 구분을 위한 마커 한 줄만 앞에 붙인다
          {
            echo "<!-- ai-review:ci -->"
            cat /tmp/review.md
          } > /tmp/comment.md
          # PR당 댓글 하나를 유지하고 실행마다 갱신한다
          # --paginate는 --jq를 페이지마다 적용하므로 id를 모두 뽑은 뒤 마지막 것을 쓴다
          id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- ai-review:ci -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@/tmp/comment.md >/dev/null
            echo "updated comment ${id}"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment.md
          fi
          cat /tmp/review.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q "🔴" /tmp/review.md; then
            echo "::error::최신 리뷰에 차단 항목이 있어 체크를 실패시킵니다"
            exit 1
          fi
