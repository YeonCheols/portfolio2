name: Deploy MCP

on:
  push:
    branches:
      - master
    paths:
      - "mcp/**"
      - ".github/workflows/deploy-mcp.yml"

concurrency:
  group: deploy-mcp-master
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-mcp:
    name: Deploy MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portfolio/mcp:${{ github.sha }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GCP WIF 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: gcloud 설치
        uses: google-github-actions/setup-gcloud@v2

      - name: Artifact Registry 로그인
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: MCP 이미지 빌드와 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./mcp
          push: true
          tags: ${{ env.IMAGE }}

      - name: portfolio-api introspection을 사용하는 공개 MCP 서버 배포
        run: |
          SECRETS="MCP_AUTH_SERVICE_TOKEN=MCP_AUTH_TOKEN:latest,RESUME_CONNECTION_TOKEN=RESUME_CONNECTION_TOKEN:latest"
          # 동적 설정 모드일 때만 조회 토큰 secret을 런타임에 연결한다
          if [ -n "${{ vars.RESUME_MODEL_SETTING_URL }}" ]; then
            SECRETS="${SECRETS},RESUME_MODEL_SETTING_TOKEN=RESUME_MODEL_SETTING_TOKEN:latest"
          fi
          gcloud run deploy portfolio-mcp \
            --image "${IMAGE}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --set-secrets="${SECRETS}" \
            --set-env-vars=PORTFOLIO_API_URL="${{ vars.PORTFOLIO_API_URL }}",PORTFOLIO_API_AUTH_ISSUER="${{ vars.PORTFOLIO_API_AUTH_ISSUER }}",MCP_PUBLIC_URL="${{ vars.MCP_PUBLIC_URL }}",RESUME_CONNECTION_URL="${{ vars.RESUME_CONNECTION_URL }}",RESUME_MODEL_SETTING_URL="${{ vars.RESUME_MODEL_SETTING_URL }}",RESUME_MODEL_ENVIRONMENT="${{ vars.RESUME_MODEL_ENVIRONMENT }}",RESUME_MODEL_URL="${{ vars.RESUME_MODEL_URL }}",RESUME_MODEL_TOKEN="${{ secrets.RESUME_MODEL_TOKEN }}",RESUME_MODEL_PROVIDER="${{ vars.RESUME_MODEL_PROVIDER }}",RESUME_MODEL_NAME="${{ vars.RESUME_MODEL_NAME }}" \
            --service-account=${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --quiet
