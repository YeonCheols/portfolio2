name: Deploy MCP

on:
  push:
    branches:
      - master
    paths:
      - "mcp/**"
      - ".github/workflows/deploy-mcp.yml"

concurrency:
  group: deploy-mcp-master
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-mcp:
    name: Deploy MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portfolio/mcp:${{ github.sha }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GCP WIF 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: gcloud 설치
        uses: google-github-actions/setup-gcloud@v2

      - name: 이미지에 포함할 portfolio-config CLI 준비
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          umask 077
          gcloud secrets versions access latest \
            --secret=PORTFOLIO_CONFIG_READ_TOKEN --project="$GCP_PROJECT_ID" \
            --out-file="$RUNNER_TEMP/portfolio-config-read-token"
          GH_TOKEN="$(cat "$RUNNER_TEMP/portfolio-config-read-token")"
          export GH_TOKEN
          gh api repos/YeonCheols/portfolio-config/contents/scripts/install.sh?ref=cli-v0.2.1 \
            --header 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/install-portfolio-config.sh"
          bash "$RUNNER_TEMP/install-portfolio-config.sh" cli-v0.2.1 "$RUNNER_TEMP/portfolio-config-bin"

      - name: Artifact Registry 로그인
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: MCP 이미지 빌드와 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./mcp
          build-contexts: |
            configcli=${{ runner.temp }}/portfolio-config-bin
          push: true
          tags: ${{ env.IMAGE }}

      - name: 시작 시 중앙 설정을 읽는 공개 MCP 서버 배포
        run: |
          gcloud run deploy portfolio-mcp \
            --image "${IMAGE}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --set-secrets=GH_TOKEN=PORTFOLIO_CONFIG_READ_TOKEN:latest \
            --set-env-vars=PORTFOLIO_CONFIG_ENVIRONMENT=production,PORTFOLIO_CONFIG_REF=master \
            --service-account=${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --quiet

      - name: 임시 인증파일 정리
        if: always()
        run: rm -f -- "$RUNNER_TEMP/portfolio-config-read-token" "$RUNNER_TEMP/install-portfolio-config.sh"
