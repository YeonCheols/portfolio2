name: Deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - "mcp/**"
      - "AGENTS.md"
      - ".cursor/rules/agents.mdc"
      - ".github/copilot-instructions.md"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-mcp.yml"
      - "tests/infrastructure/deploy.workflow.test.ts"

concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portfolio/web:${{ github.sha }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GCP WIF 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: gcloud 설치
        uses: google-github-actions/setup-gcloud@v2

      - name: Artifact Registry 로그인
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: 이미지 빌드와 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            GITHUB_NPM_TOKEN=${{ secrets.NPM_TOKEN }}

      - name: Cloud Run 배포
        run: |
          gcloud run deploy portfolio-web \
            --image "${IMAGE}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --set-secrets=API_URL=API_URL:latest,BLOG_API_URL=BLOG_API_URL:latest,DEVTO_KEY=DEVTO_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLOUD_BILLING_ACCOUNT=GOOGLE_CLOUD_BILLING_ACCOUNT:latest,SPOTIFY_CLIENT_ID=SPOTIFY_CLIENT_ID:latest,SPOTIFY_CLIENT_SECRET=SPOTIFY_CLIENT_SECRET:latest,SPOTIFY_REFRESH_TOKEN=SPOTIFY_REFRESH_TOKEN:latest,GITHUB_ACCESS_TOKEN=GITHUB_ACCESS_TOKEN:latest,SENTRY_DSN=SENTRY_DSN:latest,WAKATIME_API_KEY=WAKATIME_API_KEY:latest,RESUME_CONNECTION_TOKEN=RESUME_CONNECTION_TOKEN:latest \
            --set-env-vars=GOOGLE_CLOUD_PROJECT_ID="${{ vars.GCP_PROJECT_ID }}",NEXT_PUBLIC_GITHUB_USER_NAME="${{ vars.NEXT_PUBLIC_GITHUB_USER_NAME }}" \
            --service-account=${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --quiet
