name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "mcp/**"
      - "AGENTS.md"
      - ".cursor/rules/agents.mdc"
      - ".github/copilot-instructions.md"
      - ".github/workflows/deploy-mcp.yml"
      - "tests/infrastructure/deploy.workflow.test.ts"

concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portfolio/web:${{ github.sha }}-${{ github.run_id }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GCP WIF 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: gcloud 설치
        uses: google-github-actions/setup-gcloud@v2

      - name: 최신 portfolio-config CLI 준비
        run: |
          umask 077
          gcloud secrets versions access latest \
            --secret=PORTFOLIO_CONFIG_READ_TOKEN --project="${{ vars.GCP_PROJECT_ID }}" \
            --out-file="$RUNNER_TEMP/portfolio-config-read-token"
          GH_TOKEN="$(cat "$RUNNER_TEMP/portfolio-config-read-token")"
          export GH_TOKEN
          cliTag=$(sh scripts/install-config-cli.sh --latest)
          sh scripts/install-config-cli.sh "$RUNNER_TEMP/portfolio-config-bin" "$cliTag"
          "$RUNNER_TEMP/portfolio-config-bin/portfolio-config" validate --app portfolio-web --env production
          # 토큰은 중앙 설정을 받은 자식 셸에서만 확장합니다.
          # shellcheck disable=SC2016
          "$RUNNER_TEMP/portfolio-config-bin/portfolio-config" run --app portfolio-web --env production -- \
            sh -c 'test -n "$GITHUB_NPM_TOKEN" || exit 2; printf "%s" "$GITHUB_NPM_TOKEN" > "$1"' \
            sh "$RUNNER_TEMP/portfolio-npm-token"
          echo "PORTFOLIO_CONFIG_CLI_TAG=$cliTag" >> "$GITHUB_ENV"
          echo "portfolio-config CLI: $cliTag" >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact Registry 로그인
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: 이미지 빌드와 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache-filters: builder
          tags: ${{ env.IMAGE }}
          build-contexts: |
            configcli=${{ runner.temp }}/portfolio-config-bin
          labels: |
            io.portfolio.config-cli.version=${{ env.PORTFOLIO_CONFIG_CLI_TAG }}
          secret-files: |
            github-token=${{ runner.temp }}/portfolio-config-read-token
            npm-token=${{ runner.temp }}/portfolio-npm-token

      - name: Cloud Run 배포
        run: |
          gcloud run deploy portfolio-web \
            --image "${IMAGE}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --set-secrets=GH_TOKEN=PORTFOLIO_CONFIG_READ_TOKEN:latest \
            --clear-env-vars \
            --service-account=${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --quiet

      - name: 임시 인증파일 정리
        if: always()
        run: rm -f -- "$RUNNER_TEMP/portfolio-config-read-token" "$RUNNER_TEMP/portfolio-npm-token"
